[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaomi-ai-bridge"
version = "0.1.0"
description = "Self-hosted AI gateway and home automation hub"
license = { text = "MIT AND LGPL-2.1-or-later" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.11,<4",
  "miservice_fork==2.9.3",
  "paho-mqtt>=2.1,<3",
]

[project.scripts]
xiaomi-ai-bridge = "xiaomi_ai_bridge.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xiaomi_ai_bridge = ["web/*.html", "web/*.css", "web/*.js", "web/*.png", "licenses/*.txt", "licenses/*.md"]
